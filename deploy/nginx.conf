server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Document uploads are capped at 20 MB by the backend; leave headroom for
    # the multipart envelope so nginx isn't the one rejecting a valid file.
    client_max_body_size 25m;

    # Everything is served from one origin — the browser never talks to :3001
    # directly, so no CORS is involved for users of the thin frontend.
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A round makes one sequential LLM call per persona plus the moderator,
        # and report generation runs two more. Minutes, not seconds — nginx's
        # 60s default would cut the request off mid-generation and leave the
        # user staring at a 504 while the backend still finishes the work.
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # Stream the response straight through instead of waiting to buffer it.
        proxy_buffering off;
    }

    # No /uploads location: the backend does not serve uploaded documents any
    # more (they were public and unauthenticated), and the files are deleted
    # once their text has been extracted. A request for /uploads/... now falls
    # through to the SPA shell below, like any other unknown path.

    # Static assets are content-hashed by Vite, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The app has no router — any unknown path still resolves to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
